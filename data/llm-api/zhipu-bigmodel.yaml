tags: [OpenAI 兼容, 免费模型, 含视觉与图像生成]
notes: >-
  Flash 系列长期按单价 0 计费：glm-4.7-flash（200K）、glm-4-flash-250414（128K）、
  glm-4.6v-flash、glm-4v-flash、glm-4.1v-thinking-flash，另有 CogView-3-Flash 生图、
  CogVideoX-Flash 生视频按次免费。旗舰 GLM-5.x 系列均付费。没有公开的免费配额
  数字，限流是账户级并发数（超出报 1302），具体数值要登录控制台看。注册只需
  手机号（支持海外号），官方 FAQ 明确 API 调用不强制实名。坑点：API Key 分
  个人套餐 / 团队套餐 / 模型标准 API 三类互不通用，用错类型会直接调用失败；
  「缓存存储限时免费」是另一回事，别和模型免费混为一谈。

